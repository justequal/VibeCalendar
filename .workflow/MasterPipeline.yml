# ==============================================================================
# Gitee Go 主干分支持续集成流水线 (MasterPipeline)
# 
# 职责说明：
# 对接 Gitee Go 默认 MasterPipeline 命名规范，确保在 Gitee 流水线控制台中无缝识别。
# ==============================================================================
version: '1.0'
name: MasterPipeline
displayName: '主干流水线 (CI)'

triggers:
  push:
    branches:
      include:
        - main
  pull_request:
    branches:
      include:
        - main

stages:
  - stage:
      name: test_stage
      displayName: '测试与校验阶段'
      steps:
        - step: build@nodejs
          name: verify_nodejs
          displayName: 'Node.js 语法校验与单元测试'
          nodeVersion: 22.12.0
          commands:
            - set -e
            - npm config set registry https://registry.npmmirror.com
            - npm ci --ignore-scripts
            - npm run verify
